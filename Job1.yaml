resources:
  jobs:
    energy_market_replay_pipeline_final:
      name: energy_market_replay_pipeline_final
      tasks:
        - task_key: setup_project
          notebook_task:
            notebook_path: ./00_setup_project.ipynb
            source: WORKSPACE
        - task_key: ingest_caiso
          depends_on:
            - task_key: setup_project
          notebook_task:
            notebook_path: ./06_ingest_caiso_prices.ipynb
            source: WORKSPACE
          max_retries: 3
          min_retry_interval_millis: 300000
          disable_auto_optimization: false
        - task_key: bronze_caiso
          depends_on:
            - task_key: ingest_caiso
          notebook_task:
            notebook_path: ./07_bronze_caiso_prices.ipynb
            source: WORKSPACE
        - task_key: ingest_nlr
          depends_on:
            - task_key: setup_project
          notebook_task:
            notebook_path: ./01_ingest_nlr.ipynb
            source: WORKSPACE
        - task_key: bronze_nlr
          depends_on:
            - task_key: ingest_nlr
          notebook_task:
            notebook_path: ./02_bronze_nlr.ipynb
            source: WORKSPACE
        - task_key: ingest_weather
          depends_on:
            - task_key: setup_project
          notebook_task:
            notebook_path: ./04_ingest_weather_forecasts.ipynb
            source: WORKSPACE
          max_retries: 3
          min_retry_interval_millis: 300000
          disable_auto_optimization: false
        - task_key: silver_caiso
          depends_on:
            - task_key: bronze_caiso
          notebook_task:
            notebook_path: /09_gold_market_replay.ipynb
            source: WORKSPACE
        - task_key: silver_nlr
          depends_on:
            - task_key: bronze_nlr
          notebook_task:
            notebook_path: /03_silver_nlr.ipynb
            source: WORKSPACE
        - task_key: silver_weather
          depends_on:
            - task_key: ingest_weather
          notebook_task:
            notebook_path: /05_silver_weather.ipynb
            source: WORKSPACE
        - task_key: gold_market_replay
          depends_on:
            - task_key: silver_caiso
            - task_key: silver_nlr
            - task_key: silver_weather
          notebook_task:
            notebook_path: /09_gold_market_replay.ipynb
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: evaluation_end_date_local_exclusive
          default: 2024-11-01
        - name: evaluation_start_date_local
          default: 2024-07-01
        - name: fmm_history_buffer_days
          default: "1"
      performance_target: PERFORMANCE_OPTIMIZED
